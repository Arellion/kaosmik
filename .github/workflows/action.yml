name: 'Setup project'
description: 'Install dependencies and setup environment'

runs:
  using: 'composite'
  steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: intl, mbstring, mysqli

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress
      shell: bash