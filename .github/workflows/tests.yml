name: tests.yml
on:
  push:
    branches: [ main, test ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: [ '8.2', '8.4' ]

    # ── SERVICE MARIADB (même famille que le docker-compose du projet) ──
    services:
      mariadb:
        image: mariadb:latest   # à épingler (poste local ET CI) une fois la version choisie
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: kaosmik_tests
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10